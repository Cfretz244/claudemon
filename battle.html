<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudemon - Battle Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gb-darkest: #0f380f;
      --gb-dark: #306230;
      --gb-light: #8bac0f;
      --gb-lightest: #9bbc0f;
      --bg-deep: #0a0e14;
      --bg-panel: #111820;
      --bg-card: #182030;
      --bg-card-hover: #1e2a3e;
      --border: #2a3a50;
      --border-active: #4a8a4a;
      --text: #c8d0d8;
      --text-dim: #687888;
      --text-bright: #e8f0f8;
      --accent: #58a830;
      --accent-glow: #78c850;
      --danger: #c04040;
      --danger-glow: #e06060;
      --gold: #f8d030;
      --type-normal: #a8a878; --type-fire: #f08030; --type-water: #6890f0;
      --type-electric: #f8d030; --type-grass: #78c850; --type-ice: #98d8d8;
      --type-fighting: #c03028; --type-poison: #a040a0; --type-ground: #e0c068;
      --type-flying: #a890f0; --type-psychic: #f85888; --type-bug: #a8b820;
      --type-rock: #b8a038; --type-ghost: #705898; --type-dragon: #7038f8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-deep); color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5;
      min-height: 100vh; overflow-x: hidden;
    }
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    .header {
      background: linear-gradient(180deg, #141c28 0%, var(--bg-deep) 100%);
      border-bottom: 1px solid var(--border); padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 {
      font-family: 'Silkscreen', monospace; font-size: 20px; font-weight: 700;
      color: var(--gb-lightest); letter-spacing: 1px;
    }
    .header p { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .header a { color: var(--text-dim); font-size: 12px; text-decoration: none; border-bottom: 1px dotted var(--border); }
    .header a:hover { color: var(--accent-glow); }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 32px 64px; }
    .btn {
      background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; font-family: inherit; font-size: 12px; cursor: pointer;
      border-radius: 3px; transition: background .12s, border-color .12s;
    }
    .btn:hover:not(:disabled) { background: var(--bg-card-hover); border-color: var(--border-active); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent-glow); color: #061006; font-weight: 700; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-glow); }
    .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger-glow); }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .toolbar label { color: var(--text-dim); font-size: 12px; }
    input, select {
      background: var(--bg-panel); color: var(--text); border: 1px solid var(--border);
      padding: 5px 7px; font-family: inherit; font-size: 12px; border-radius: 3px;
    }
    input:focus, select:focus { outline: none; border-color: var(--border-active); }
    .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 1000px) { .sides { grid-template-columns: 1fr; } }
    .section { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-family: 'Silkscreen', monospace; font-size: 13px; color: var(--gb-lightest); letter-spacing: .5px;
    }
    .section-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .count { color: var(--text-dim); font-size: 11px; }
    .slot { background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px; padding: 10px; }
    .slot-head { display: flex; align-items: center; gap: 8px; }
    .slot-num {
      background: var(--gb-dark); color: var(--gb-lightest); font-family: 'Silkscreen', monospace;
      font-size: 11px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 3px;
    }
    .slot-species { flex: 1; min-width: 0; }
    .lv { color: var(--text-dim); font-size: 11px; display: flex; align-items: center; gap: 4px; }
    .lv input { width: 58px; }
    .slot-types { display: flex; gap: 5px; margin: 8px 0; }
    .type-tag {
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 2px;
      color: #0a0e14; text-transform: uppercase; letter-spacing: .5px;
    }
    .type-normal{background:var(--type-normal)} .type-fire{background:var(--type-fire)}
    .type-water{background:var(--type-water)} .type-electric{background:var(--type-electric)}
    .type-grass{background:var(--type-grass)} .type-ice{background:var(--type-ice)}
    .type-fighting{background:var(--type-fighting)} .type-poison{background:var(--type-poison)}
    .type-ground{background:var(--type-ground)} .type-flying{background:var(--type-flying)}
    .type-psychic{background:var(--type-psychic)} .type-bug{background:var(--type-bug)}
    .type-rock{background:var(--type-rock)} .type-ghost{background:var(--type-ghost)}
    .type-dragon{background:var(--type-dragon)}
    .slot-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .slot-moves select { width: 100%; min-width: 0; }
    .slot-default-moves { margin-top: 8px; }
    .ai-note {
      margin-top: 20px; padding: 12px 16px; background: var(--bg-panel);
      border: 1px solid var(--border); border-left: 3px solid var(--gold);
      border-radius: 3px; color: var(--text-dim); font-size: 12px;
    }
    .ai-note strong { color: var(--gold); }
    .errors {
      margin-top: 20px; padding: 12px 16px 12px 34px; background: #1a1014;
      border: 1px solid var(--danger); border-radius: 3px; color: var(--danger-glow); font-size: 12px;
    }
    .start-bar { margin-top: 24px; display: flex; gap: 12px; align-items: center; }
    #sim-battle { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 24px; }
    #game-container {
      width: 640px; height: 576px; max-width: 100%;
      background: #000; border: 1px solid var(--border);
    }
    #game-container canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    .hint { color: var(--text-dim); font-size: 12px; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--bg-card); border: 1px solid var(--border-active); color: var(--text-bright);
      padding: 10px 18px; border-radius: 3px; font-size: 12px; opacity: 0;
      transition: transform .2s, opacity .2s; z-index: 10000; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>BATTLE SIMULATOR</h1>
      <p>Build both sides, then drop straight into the real BattleScene.</p>
    </div>
    <a href="/index.html">&larr; back to the game</a>
  </div>

  <div class="container">
    <div id="sim-setup">
      <div class="toolbar">
        <label for="player-name">Player</label>
        <input id="player-name" maxlength="10" size="10">
        <label for="opponent-kind">Opponent</label>
        <select id="opponent-kind">
          <option value="wild">Wild Pokemon</option>
          <option value="trainer">Trainer</option>
        </select>
        <span id="trainer-fields" class="toolbar" style="margin:0">
          <label for="trainer-class">Class</label>
          <select id="trainer-class"></select>
          <label for="trainer-name">Name</label>
          <input id="trainer-name" maxlength="12" size="12">
        </span>
        <button id="sim-reset" class="btn btn-sm">Reset</button>
      </div>

      <div class="sides">
        <div class="section">
          <div class="section-header">
            <span class="section-title">YOUR PARTY</span>
            <span><span id="player-count" class="count"></span>
              <button id="player-add" class="btn btn-sm">+ add</button></span>
          </div>
          <div class="section-body" id="player-party"></div>
        </div>

        <div class="section">
          <div class="section-header">
            <span class="section-title">OPPONENT</span>
            <span><span id="opponent-count" class="count"></span>
              <button id="opponent-add" class="btn btn-sm">+ add</button></span>
          </div>
          <div class="section-body" id="opponent-party"></div>
        </div>
      </div>

      <div class="ai-note"><strong>Opponent AI:</strong> <span id="ai-note"></span></div>
      <ul class="errors" id="errors" hidden></ul>

      <div class="start-bar">
        <button id="sim-start" class="btn btn-primary">START BATTLE</button>
        <span class="hint">Z / Enter = confirm, X = cancel, arrows = move.</span>
      </div>
    </div>

    <div id="sim-battle" hidden>
      <div id="game-container"></div>
      <button id="sim-quit" class="btn btn-danger">Quit battle &amp; return to setup</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="/src/battleSim.ts"></script>
</body>
</html>
